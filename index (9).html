<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuangan</title>
<meta name="theme-color" content="#F4F5F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuangan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--card:#fff;--line:#E4E7EC;--text:#111827;--sub:#8A8F98;--blue:#14A9FF;--active:#1F3FEA;--inc:#16A34A;--exp:#E5484D;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--track:#E9ECF1;--ph:#D5D9E0;color-scheme:light}
*{box-sizing:border-box;margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button:focus:not(:focus-visible){outline:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 6px}
h1{font-weight:600;font-size:22px;letter-spacing:-.01em}
main{flex:1;padding:10px 16px 14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:0}
main.scroll{overflow-y:auto}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:10px;padding:14px 16px}
.lbl{font-size:12.5px;color:var(--sub)}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.row{display:flex;gap:10px}.row .card{flex:1;min-width:0}
.mid{font-size:17px;font-weight:600;margin-top:3px;white-space:nowrap}
h2{font-size:13px;font-weight:500;color:var(--sub);margin:8px 2px 0}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px}
.ic{width:40px;height:40px;border-radius:8px;background:var(--blue);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;color:#fff}
.tx .t{flex:1;min-width:0}.tx .n{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d{font-size:12px;color:var(--sub);margin-top:1px}
.tx .r{text-align:right}.r b{font-size:14px;font-weight:600}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:space-around}
nav button{border:0;background:none;width:60px;height:40px;display:grid;place-items:center;cursor:pointer;color:#9AA3AF}
nav button.on{color:var(--active)}
nav svg.f{fill:currentColor;stroke:currentColor;stroke-width:1.4}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-size:14px;font-weight:500;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.field{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.field span{color:var(--sub);margin-right:8px;font-size:16px}
input{width:100%;border:0;background:none;color:var(--text);padding:12px 0;font-size:16px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.save{border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:600;padding:13px;border-radius:10px;margin-top:auto;cursor:pointer}
.bar{height:4px;border-radius:2px;background:var(--track);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.sp{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.sp span{display:flex;align-items:center;gap:8px}
.sp svg{width:16px;height:16px;color:var(--blue)}
header.add{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
header.add h1{text-align:center;font-size:18px}
.back{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--sub);text-transform:uppercase;margin:0 2px 10px}
.amtbox{text-align:center;padding:12px 0 20px}
.amtbox{flex:1;display:flex;flex-direction:column;justify-content:center}
.amtbox .sl{margin:0 0 12px}
.amtrow{display:flex;justify-content:center;align-items:center;gap:10px}
.amtrow span{font-size:28px;font-weight:600;color:#9AA3AF}
.amtrow input{width:1ch;min-width:1ch;max-width:75%;font-size:44px;font-weight:600;padding:0;text-align:left;letter-spacing:-.02em}
.amtrow input::placeholder{color:var(--ph)}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--sub);cursor:pointer;padding:0}
.cat i{width:100%;max-width:64px;aspect-ratio:1;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border-radius:10px}
.cat svg{width:22px;height:22px;color:var(--sub)}
.cat.on{color:var(--blue);font-weight:600}
.cat.on i{background:var(--blue);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--blue)}
.cat.on svg{color:#fff}
button.field{width:100%;font:inherit;font-size:16px;color:var(--text);padding:12px 14px;justify-content:space-between;cursor:pointer;text-align:left}
.sheet{position:absolute;inset:0;background:rgba(17,24,39,.35);display:flex;align-items:flex-end;z-index:10}
.panel{width:100%;background:var(--card);border-radius:12px 12px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel .ph{font-size:15px;font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}.opts.d{grid-template-columns:repeat(7,1fr)}.opts.m{grid-template-columns:repeat(3,1fr)}
.opts button{border:0;background:var(--bg);color:var(--text);border-radius:8px;padding:11px 0;font:inherit;font-size:14px;cursor:pointer}
.opts button.on{background:var(--blue);color:#fff;font-weight:600}
.pg-add .two{margin-top:6px}
.ph0,.field input::placeholder{color:#9AA3AF}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:16px;padding:12px 0;outline:none;appearance:none;-webkit-appearance:none;font-family:inherit}
.field svg{width:18px;height:18px;margin-left:8px;flex:none;color:var(--sub);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pg-add{gap:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.cats{flex:1.3;display:flex;flex-direction:column;min-height:0;padding-bottom:10px}
.cats .grid{flex:1;align-content:space-evenly}
.cats .sl{position:relative;top:-4px}
.pg-add .seg button{padding:11px}
.pg-add .save{padding:15px}
button.field{padding:14px}
@media (max-height:700px){.amtbox{padding:4px 0 12px}.amtrow input{font-size:36px}.cat i{max-width:48px}.grid{gap:8px}.pg-add{gap:16px}.cats{padding-bottom:4px}.pg-add .seg button{padding:8px}.pg-add .save{padding:12px}}
.rec{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
.rec .tx{min-height:0;overflow:hidden}
.del{border:0;background:none;padding:6px;margin-right:-6px;display:grid;color:#9AA3AF;cursor:pointer}
.del svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.del.arm{color:var(--exp)}
button,.card,.tx{transition:transform .12s ease}
button:active,.card:active,.tx:active{transform:scale(.97)}
.card.p0:active,.srow:active{transform:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:rotate(-14deg)}50%{transform:rotate(11deg)}75%{transform:rotate(-6deg)}}
@keyframes grow{from{transform:scaleX(0)}}
.fx{animation:fade .15s ease}
.sheet{animation:fade .2s ease}
.panel{animation:up .25s ease-out}
.cat.pop i{animation:pop .28s ease}
.del.arm svg{animation:shake .35s ease}
.bar i{transform-origin:left;animation:grow .6s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.mr .mid{margin-top:0;min-width:0}
.ar{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mid{overflow:hidden;text-overflow:clip}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,8px);background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

header:not(.add){display:flex;align-items:center;justify-content:space-between}
.mn{border:0;background:none;width:40px;height:40px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:var(--text);cursor:pointer}
.mn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.card.p0{padding:0;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border:0;background:none;color:var(--text);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.srow+.srow{border-top:1px solid var(--line)}
.ck{width:20px;height:20px;fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rd{width:24px;height:24px;border-radius:50%;background:#B4B9C2;flex:none;display:grid;place-items:center;transition:background .15s}
.rd.on{background:#16C55E}
.rd svg{width:14px;height:14px;fill:none;stroke:#0B1F12;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.rd.on svg{opacity:1}
.sw{width:36px;height:20px;border-radius:10px;background:#C9CED6;position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(16px)}
:root[data-theme="dark"]{--bg:#121316;--card:#1C1E22;--line:#2B2E34;--text:#F2F4F7;--sub:#8B93A1;--active:#6F8BFF;--inc:#34C77B;--exp:#F0646A;--shadow:0 0 0 1px rgba(255,255,255,.05);--track:#2B2E34;--ph:#4A4F58;color-scheme:dark}
html.tt,html.tt *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease,fill .35s ease,stroke .35s ease!important}

/* ===== Desktop ===== */
@media (min-width:900px){
:root{--desk:#E6E9EE}
:root[data-theme="dark"]{--desk:#0A0B0D}
html,body{background:var(--desk)}
#app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto minmax(0,1fr);width:calc(100% - 48px);max-width:820px;height:min(860px,calc(100dvh - 48px));margin:24px auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px rgba(16,24,40,.12)}
header{grid-column:2;grid-row:1;padding:28px 32px 8px}
header.add{padding:20px 24px 8px}
h1{font-size:24px}
header.add h1{font-size:18px}
main{grid-column:2;grid-row:2;padding:12px 32px 28px}
main.pg-add{width:100%;max-width:600px;justify-self:center;padding-bottom:28px}
nav{display:flex!important;grid-column:1;grid-row:1/3;flex-direction:column;justify-content:flex-start;align-items:center;gap:8px;width:88px;padding:24px 0;border-top:0;border-right:1px solid var(--line);border-radius:20px 0 0 20px}
nav::before{content:"";width:44px;height:44px;margin-bottom:20px;border-radius:12px;background:url(icon-192.png) center/cover}
nav button{width:48px;height:48px;border-radius:12px;transition:background .15s,color .15s,transform .12s ease}
nav button:hover{background:var(--bg)}
nav button.on{background:color-mix(in srgb,var(--active) 12%,transparent)}
.rec{flex:none;grid-template-rows:none;grid-auto-rows:68px}
.tx,.card{transition:transform .12s ease,box-shadow .15s}
.tx:hover{box-shadow:0 2px 8px rgba(16,24,40,.10)}
.srow:hover,.opts button:hover{filter:brightness(.97)}
.cat:hover i{box-shadow:0 2px 8px rgba(16,24,40,.12)}
.sheet{align-items:center;justify-content:center;border-radius:20px}
.panel{width:min(420px,calc(100% - 48px));border-radius:16px;padding:20px;animation:fade .2s ease}
#toast{bottom:24px}
}
</style>
</head>
<body>
<div id="app">
  <header></header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="sheet"></div>
</div>
<script>
const CATS={
 expense:[["Makanan","food"],["Transport","car"],["Belanja","bag"],["Tagihan","zap"],["Hiburan","game"],["Kesehatan","heart"],["Pendidikan","book"],["Lainnya","more"]],
 income:[["Gaji","wallet"],["Bonus","gift"],["Freelance","laptop"],["Usaha","store"],["Investasi","trend"],["Penjualan","tag"],["Refund","undo"],["Lainnya","more"]]
};
const CI={
food:'<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3Zm0 0v7"/>',
car:'<path d="M19 17h2a1 1 0 0 0 1-1v-3a2 2 0 0 0-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3A2.4 2.4 0 0 0 12 7H5a1.6 1.6 0 0 0-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4a1 1 0 0 0 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
game:'<path d="M6 12h4M8 10v4"/><circle cx="15" cy="13" r=".6"/><circle cx="18" cy="11" r=".6"/><rect x="2" y="6" width="20" height="12" rx="4"/>',
heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
wallet:'<path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
laptop:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/>',
store:'<path d="M4 9 5.5 4h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>'
};
const NAV={home:'<path d="M12 3.5 4.5 10.2v9.3q0 1 1 1h4.3V16a2.2 2.2 0 0 1 4.4 0v4.5h4.3q1 0 1-1v-9.3z"/>',
list:'<path d="M6 3h12a1 1 0 0 1 1 1v17l-2.4-1.6L14.2 21 12 19.4 9.8 21l-2.4-1.6L5 21V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/>',
add:'<path d="M12 5v14M5 12h14"/>',
chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>'};
let tx=[],tab="home",form={type:"income",cat:"Gaji",amt:"",day:"",month:null};
try{tx=JSON.parse(localStorage.getItem("kuangan")||"[]")}catch(e){}
let set={dark:false,lang:"en"};
try{Object.assign(set,JSON.parse(localStorage.getItem("kuangan_set")||"{}"))}catch(e){}
const LOC=()=>set.lang==="en"?"en-GB":"id-ID";
const LX={
en:{balance:"Balance",income:"Income",expenses:"Expenses",recent:"Recent Transaction",empty:"No transactions yet",tTitle:"Transaction",aTitle:"Analytics",today:"Today",yesterday:"Yesterday",addTitle:"Add Transaction",expense:"Expense",spent:"Amount",received:"Amount",selcat:"Select category",date:"Date",month:"Month",save:"Save Transaction",totalExp:"Total Expenses",dark:"Dark mode",lang:"Language",back:"Back",del:"Delete",menu:"Menu",settings:"Settings",exitMsg:"Press back again to exit",maxBal:"Maximum balance is Rp 1.000.000.000"},
id:{balance:"Saldo",income:"Pemasukan",expenses:"Pengeluaran",recent:"Transaksi Terbaru",empty:"Belum ada transaksi",tTitle:"Transaksi",aTitle:"Analitik",today:"Hari ini",yesterday:"Kemarin",addTitle:"Tambah Transaksi",expense:"Pengeluaran",spent:"Jumlah",received:"Jumlah",selcat:"Pilih kategori",date:"Tanggal",month:"Bulan",save:"Simpan Transaksi",totalExp:"Total Pengeluaran",dark:"Mode gelap",lang:"Bahasa",back:"Kembali",del:"Hapus",menu:"Menu",settings:"Pengaturan",exitMsg:"Tekan sekali lagi untuk keluar",maxBal:"Saldo maksimal Rp 1.000.000.000"}
};
const t=k=>LX[set.lang][k];
const CN={Makanan:"Food",Transport:"Transport",Belanja:"Shopping",Tagihan:"Bills",Hiburan:"Entertainment",Kesehatan:"Health",Pendidikan:"Education",Lainnya:"Other",Gaji:"Salary",Bonus:"Bonus",Freelance:"Freelance",Usaha:"Business",Investasi:"Investments",Penjualan:"Sales",Refund:"Refund"};
const cn=c=>set.lang==="en"?(CN[c]||c):c;
const MONTHS={en:["January","February","March","April","May","June","July","August","September","October","November","December"],id:["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]};
const mkMon=()=>MONTHS[set.lang].slice();
const applyTheme=()=>{document.documentElement.dataset.theme=set.dark?"dark":"light";{const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=set.dark?"#121316":"#F4F5F7"}document.documentElement.lang=set.lang==="en"?"en":"id"};
const saveSet=()=>{try{localStorage.setItem("kuangan_set",JSON.stringify(set))}catch(e){}};
applyTheme();
const save=()=>{try{localStorage.setItem("kuangan",JSON.stringify(tx))}catch(e){}};
const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(n);
const fd=s=>{const d=new Date(s+"T00:00:00");return d.getDate()+" "+MONTHS[set.lang][d.getMonth()]};
const icon=(t,c)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+CI[(CATS[t].find(x=>x[0]===c)||[0,"more"])[1]]+'</svg>';
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function dayLabel(s){
 const t=new Date(),y=new Date(Date.now()-864e5);
 if(s===ymd(t))return LX[set.lang].today;if(s===ymd(y))return LX[set.lang].yesterday;
 const d=new Date(s+"T00:00:00");
 return d.getDate()+" "+MONTHS[set.lang][d.getMonth()]+", "+d.getFullYear();
}
let MON=mkMon();
const CHV='<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
const sorted=()=>[...tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const sum=t=>tx.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const E=()=>`<div class="empty">${t("empty")}</div>`;
function item(x,grouped){
 return `<div class="tx"><div class="ic">${icon(x.type,x.cat)}</div><div class="t"><div class="n">${esc(cn(x.cat))}</div>${grouped?"":`<div class="d">${fd(x.date)}</div>`}</div><div class="r"><b class="${x.type==="income"?"inc":"exp"}">${rp(x.amount)}</b></div>${grouped?`<button class="del ${armed===x.id?"arm":""}" onclick="del(${x.id})" aria-label="${t("del")}"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg></button>`:""}</div>`}
function go(tb){if(tb==="add"&&tab!=="add"){form.type="income";form.cat=CATS.income[0][0]}tab=tb;pick=null;armed=null;fadeNext=true;render()}
function render(){
 const m=document.getElementById("main");m.className="";
 document.getElementById("sheet").innerHTML=tab==="add"&&pick?sheetHTML():"";
 document.getElementById("nav").style.display=tab==="add"||tab==="settings"?"none":"";
 const hd=document.querySelector("header");const sub=tab==="add"||tab==="settings";hd.className=sub?"add":"";
 hd.innerHTML=sub?`<button class="back" onclick="go(\'${tab==="add"?"home":prevTab}\')" aria-label="${tab==="settings"?LX.en.back:t("back")}"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><h1>${tab==="add"?t("addTitle"):LX.en.settings}</h1><span></span>`:`<h1>${tab==="list"?t("tTitle"):tab==="chart"?t("aTitle"):"Kuangan"}</h1><button class="mn" onclick="openSet()" aria-label="${t("menu")}"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 12h10M4 17h16"/></svg></button>`;
 if(tab==="home"){
  const i=sum("income"),e=sum("expense"),r=sorted().slice(0,4);
  m.innerHTML=`<div class="card"><div class="lbl">${t("balance")}</div><div class="big" data-k="b">${rp(i-e)}</div></div>
  <div class="row"><div class="card"><div class="lbl">${t("income")}</div><div class="mr"><div class="mid" data-k="i">${rp(i)}</div><svg class="ar inc" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div></div><div class="card"><div class="lbl">${t("expenses")}</div><div class="mr"><div class="mid" data-k="e">${rp(e)}</div><svg class="ar exp" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div></div></div>
  <h2>${t("recent")}</h2>${r.length?`<div class="rec">${r.map(x=>item(x)).join("")}</div>`:E()}`;
  const cur={b:i-e,i,e};if(!shown)shown={...cur};
  m.querySelectorAll("[data-k]").forEach(el=>cnt(el,shown[el.dataset.k],cur[el.dataset.k]));
  shown=cur;
 }else if(tab==="list"){
  m.className="scroll";const l=sorted();
  let last="",h="";
  l.forEach(x=>{if(x.date!==last){last=x.date;h+=`<h2>${dayLabel(x.date)}</h2>`}h+=item(x,1)});
  m.innerHTML=l.length?h:E();
 }else if(tab==="add"){
  m.className="pg-add";const sp=form.type==="expense";
  m.innerHTML=`<div class="seg"><button class="${sp?"":"on"}" onclick="setType('income')">${t("income")}</button><button class="${sp?"on":""}" onclick="setType('expense')">${t("expense")}</button></div>
  <div class="amtbox"><div class="sl">${sp?t("spent"):t("received")}</div><div class="amtrow"><span>Rp</span><input id="amt" inputmode="numeric" placeholder="0" value="${form.amt}" style="width:${Math.max(1,form.amt.length)}ch"></div></div>
  <div class="cats"><div class="sl">${t("selcat")}</div><div class="grid">${CATS[form.type].map(c=>`<button class="cat ${form.cat===c[0]?"on":""} ${popCat===c[0]?"pop":""}" onclick="setCat('${c[0]}')"><i>${icon(form.type,c[0])}</i>${cn(c[0])}</button>`).join("")}</div></div>
  <div class="two"><div class="field"><input id="day" inputmode="numeric" maxlength="2" placeholder="${t("date")}" value="${form.day}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,2);form.day=this.value"></div>
  <button class="field" onclick="openPick('month')"><span class="${form.month==null?"ph0":""}">${form.month==null?t("month"):MON[form.month]}</span>${CHV}</button></div>
  <button class="save" onclick="add()">${t("save")}</button>`;
  popCat=null;
  const a=document.getElementById("amt");
  a.oninput=()=>{let v=a.value.replace(/\D/g,"").replace(/^0+/,"");if(+v>1e9)v="1000000000";a.value=v?new Intl.NumberFormat("id-ID").format(v):"";form.amt=a.value;a.style.width=Math.max(1,a.value.length)+"ch";af(a)};af(a);
 }else if(tab==="settings"){
  m.className="";const ck='<svg class="ck" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
  m.innerHTML=`<div class="card p0"><button class="srow" onclick="setDark()"><span>${LX.en.dark}</span><i class="sw ${set.dark?"on":""}"></i></button></div>
  <h2>${LX.en.lang}</h2>
  ${[["id","Indonesia"],["en","English"]].map(([c,n])=>`<div class="card p0"><button class="srow" onclick="setLang('${c}')"><span>${n}</span><i class="rd ${set.lang===c?"on":""}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></i></button></div>`).join("")}`;
 }else{
  m.className="scroll";const e=sum("expense"),by={};
  tx.filter(x=>x.type==="expense").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  m.innerHTML=`<div class="card"><div class="lbl">${t("totalExp")}</div><div class="big">${rp(e)}</div></div>`+(rows.length?rows.map(([c,v])=>`<div class="card"><div class="sp"><span>${icon("expense",c)}${cn(c)}</span><b>${rp(v)}</b></div><div class="bar"><i style="width:${v/e*100}%"></i></div></div>`).join(""):E());
 }
 if(fadeNext){fadeNext=false;m.style.animation="none";void m.offsetWidth;m.style.animation="";m.classList.add("fx")}
 document.getElementById("nav").innerHTML=["home","list","add","chart"].map(t=>`<button class="${tab===t?"on":""}" onclick="go('${t}')" aria-label="${t}"><svg class="${t==="home"?"f":""}" viewBox="0 0 24 24">${NAV[t]}</svg></button>`).join("");
}
function setType(t){form.type=t;form.cat=CATS[t][0][0];render()}
let prevTab="home";
function openSet(){prevTab=tab;go("settings")}
function setDark(){
 set.dark=!set.dark;saveSet();
 const h=document.documentElement;
 if(!still){h.classList.add("tt");setTimeout(()=>h.classList.remove("tt"),450)}
 applyTheme();
 const sw=document.querySelector(".sw");if(sw)sw.classList.toggle("on",set.dark);
}
function setLang(l){set.lang=l;try{MON=mkMon();applyTheme()}catch(e){}render();saveSet()}
let pick=null,armed=null,armT=0,shown=null,popCat=null,fadeNext=false;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function cnt(el,from,to){
 if(from===to||still)return;
 el.dataset.fin=rp(to);el.textContent=rp(from);const t0=performance.now();
 (function step(t){const p=Math.min(1,(t-t0)/600),k=1-Math.pow(1-p,3);
  el.textContent=rp(Math.round(from+(to-from)*k));if(p<1)requestAnimationFrame(step)})(t0);
}
function del(id){
 clearTimeout(armT);
 if(armed===id){tx=tx.filter(x=>x.id!==id);armed=null;save()}
 else{armed=id;armT=setTimeout(()=>{armed=null;render()},3000)}
 render();
}
function openPick(k){pick=k;render()}
function closePick(){pick=null;render()}
function choose(v){form.month=v;pick=null;render()}
function sheetHTML(){
 return `<div class="sheet" onclick="closePick()"><div class="panel" onclick="event.stopPropagation()"><div class="ph">${t("month")}</div><div class="opts m">${MON.map((n,k)=>`<button class="${form.month===k?"on":""}" onclick="choose(${k})">${n}</button>`).join("")}</div></div></div>`;
}
function setCat(c){form.cat=c;popCat=c;render()}
function add(){
 const amount=parseInt(form.amt.replace(/\D/g,""),10);
 if(!amount){document.getElementById("amt").focus();return}
 const n=new Date(),y=n.getFullYear(),mo=form.month==null?n.getMonth():form.month,dim=new Date(y,mo+1,0).getDate();
 if(form.type==="income"&&sum("income")-sum("expense")+amount>1e9){toast(t("maxBal"));return}
 let d=parseInt(form.day,10);if(!d)d=n.getDate();d=Math.min(d,dim);
 tx.push({id:Date.now(),type:form.type,cat:form.cat,amount,date:y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")});
 pick=null;form.amt="";form.day="";form.month=null;save();tab="home";fadeNext=true;render();
}
function fitEl(el){const cur=el.textContent;if(el.dataset.fin)el.textContent=el.dataset.fin;el.style.fontSize="";el.style.whiteSpace="nowrap";el.style.overflowWrap="";let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>11){fs-=.5;el.style.fontSize=fs+"px"}if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace="normal";el.style.overflowWrap="anywhere"}el.textContent=cur}
function fitAll(){document.querySelectorAll(".mid,.big").forEach(fitEl)}
function af(a){const n=a.value.length;a.style.fontSize=n>19?"20px":n>15?"26px":n>13?"34px":n>11?"40px":""}
function toast(m){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.getElementById("app").appendChild(e)}e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
(function(){const r0=render;render=function(){r0();fitAll()};
try{history.replaceState({r:1},"");history.pushState({a:1},"")}catch(e){return}
let arm=0;const keep=()=>history.pushState({a:1},"");
addEventListener("popstate",()=>{
 if(history.state&&history.state.a)return;
 if(tab==="add"&&pick){closePick();keep();return}
 if(tab==="settings"){go(prevTab);keep();return}
 if(tab!=="home"){go("home");keep();return}
 if(Date.now()<arm){history.back();return}
 arm=Date.now()+2000;toast(t("exitMsg"));keep()})})();
render();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
